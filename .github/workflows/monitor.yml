name: qqdoc monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run monitor
        run: python3 monitor.py

      - name: Create notification issue
        if: hashFiles('document_changed.flag') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const changed = fs.readFileSync('document_changed.flag', 'utf8').trim();
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `【${changed}】更新提醒`,
              body: `检测到以下文档发生变化：\n\n${changed}\n\n请及时查看。`
            })

      - name: Save snapshot and flag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshot.json
          if [ -f document_changed.flag ]; then git add document_changed.flag; fi
          git diff --cached --quiet || git commit -m "update document snapshot"
          git push
